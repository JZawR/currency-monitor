version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: currency-monitor-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: currency_monitor
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - currency-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_TIME=${BUILD_TIME:-unknown}
    image: currency-monitor:latest
    pull_policy: build
    container_name: currency-monitor-app
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # MongoDB (внутри сети Docker)
      - MONGODB_URI=mongodb://mongoadmin:root@mongo:27017/currency_monitor?authSource=admin

      # PostgreSQL (на хосте) — используем special DNS имя host.docker.internal
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/test
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver

      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
    ports:
      - "8089:8089"
    networks:
      - currency-network
    restart: unless-stopped

    # 🔑 Ключевое: разрешаем контейнеру обращаться к хосту по имени host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  currency-network:
    driver: bridge

volumes:
  mongo_data: