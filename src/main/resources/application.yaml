server:
  port: 8089

spring:
  application:
    name: currency-monitor
  data:
    mongodb:
      auto-index-creation: true
      host: localhost
      database: local-mongo
      username: mongoadmin
      password: root
      authentication-database: admin
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true

app:
  sovcombank:
    api-url: https://prod-api.sovcombank.ru/service/currency-rate/index
    departments: "7100360"
    type: FIZ_NAL
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:dummy_token_for_tests}
    bot-username: ${TELEGRAM_BOT_USERNAME:}  # Добавьте, даже если пустая строка
    chat-id: ${TELEGRAM_CHAT_ID:123456789}
    threshold-usd-sell: 80.0
    anti-spam-enabled: true
    alert-cooldown-minutes: 60
  scheduler:
    cron: "0 0/30 * * * *"
  history:
    retention-days: 90

logging:
  level:
    root: INFO
    zawr.currencymonitor: DEBUG
    org.telegram.telegrambots: WARN